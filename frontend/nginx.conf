# Nginx config para PWA SPA – todas as rotas caem no index.html
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    # Service Worker: nunca em cache. Vem antes do bloco de assets: o nginx usa a primeira regra que casar
    location ~* (sw\.js|workbox-.+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Cache longo para assets com hash (Vite gera nomes com hash)
    location ~* \.(js|css|woff2|png|jpg|webp|svg|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # manifest.json sem cache, com o tipo que o navegador espera
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Navegadores pedem /favicon.ico por conta própria: entrega o ícone do AXOS
    location = /favicon.ico {
        try_files /favicon.png =404;
    }

    # Raiz do domínio: landing page (landing/index.html). O app abre em /app
    location = / {
        try_files /lp.html =404;
    }

    # SPA fallback: todas as rotas desconhecidas → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    # Navegador só abre o site por conexão segura durante 1 ano
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Política de conteúdo em modo de observação: só avisa no console o que bloquearia.
    # Ativar de verdade depois de tirar os scripts escritos dentro da página inicial.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
}
