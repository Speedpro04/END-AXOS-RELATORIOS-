# Nginx config para PWA SPA – todas as rotas caem no index.html
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               application/wasm;
    gzip_min_length 1024;

    # Cache longo para assets com hash (Vite gera nomes com hash)
    location ~* \.(js|css|woff2|png|jpg|svg|ico|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker: nunca em cache (precisa ser sempre fresh)
    location ~* (sw\.js|workbox-.+\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # manifest.json sem cache
    location = /manifest.webmanifest {
        expires -1;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # SPA fallback: todas as rotas desconhecidas → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de segurança
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
