[project]
name = "axos-backend"
version = "0.1.0"
description = "AXOS - Backend FastAPI para laudos de inspeção"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "supabase>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.3.0",
    "weasyprint>=62.0",
    "qrcode[pil]>=7.4.2",
    "stripe>=10.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    # Fila de processamento e cache
    "redis[hiredis]>=5.0.0",   # Cliente async Redis com parser C (ultra-rápido)
    "arq>=0.26.0",              # Worker assíncrono baseado em Redis
    "tenacity>=8.3.0",          # Retry com backoff exponencial
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
